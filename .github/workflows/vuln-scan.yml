name: Vulnerability Scan - multi-arch

on:
  workflow_run:
    workflows:
      - "Build & Push - multi-arch"
    types:
      - completed
  schedule:
    - cron: "0 5 * * 1" # chaque lundi à 05h00 UTC
  workflow_dispatch:

concurrency:
  group: vuln-scan-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sam-tech-lab-oss/debian-12-bookworm-s6:latest

jobs:
  scan:
    name: Scan ${{ matrix.arch }}
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    permissions:
      actions: read
      contents: read
      security-events: write # GitHub Security SARIF upload

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute version tag
        id: version
        run: |
          TAG=$(date -u +'%Y.%m')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for arm64 emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Pull ${{ matrix.arch }} image locally
        run: docker pull --platform "linux/${{ matrix.arch }}" "${IMAGE}"

      - name: Vérifier que l'image tirée est bien en ${{ matrix.arch }}
        run: |
          ARCH=$(docker image inspect --format '{{.Architecture}}' "${IMAGE}")
          echo "architecture de l'image = ${ARCH}"
          test "${ARCH}" = "${{ matrix.arch }}"

      - name: Scan image for vulnerabilities - SARIF (GitHub Security)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: false
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF to GitHub Security tab
        id: sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.arch }}

      - name: Signaler un envoi SARIF manqué
        if: steps.sarif.outcome == 'failure'
        run: |
          echo "::warning::SARIF non publié dans l'onglet Security : activez le code scanning dans Settings → Code security. Le rapport JSON et le résumé de ce run restent disponibles."

      - name: Scan image for vulnerabilities - JSON rapport complet
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy-results.json
          exit-code: '0'
          ignore-unfixed: false
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload vulnerability report (JSON artifact)
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-report-s6-${{ matrix.arch }}-${{ steps.version.outputs.tag }}
          path: trivy-results.json
          retention-days: 90

      - name: Generate vulnerability step summary
        run: |
          echo "## 🔒 Rapport de vulnérabilités - ${{ matrix.arch }} - ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image :** \`${IMAGE}\` - \`linux/${{ matrix.arch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json 2>/dev/null || echo 0)
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-results.json 2>/dev/null || echo 0)
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-results.json 2>/dev/null || echo 0)
          echo "::notice title=Vulnérabilités ${{ matrix.arch }}::CRITICAL ${CRITICAL} · HIGH ${HIGH} · MEDIUM ${MEDIUM} · LOW ${LOW}"
          jq -r '.Results[]? as $r | $r.Vulnerabilities[]? |
            select(.Severity=="CRITICAL" or .Severity=="HIGH") |
            "::warning::[\(.Severity)] \(.PkgName) \(.InstalledVersion)" +
            (if $r.Class == "os-pkgs" then ""
             else " dans \(.PkgPath // $r.Target)" end) +
            " — \(.VulnerabilityID) — correctif : \(.FixedVersion // "aucun") — \(.Title // "")"' \
            trivy-results.json || true
          echo "### Résumé" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Sévérité | Nombre |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔴 CRITICAL | ${CRITICAL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟠 HIGH     | ${HIGH} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟡 MEDIUM   | ${MEDIUM} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔵 LOW      | ${LOW} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${CRITICAL}" -gt 0 ] || [ "${HIGH}" -gt 0 ] || [ "${MEDIUM}" -gt 0 ] || [ "${LOW}" -gt 0 ]; then
            echo "### 📋 Détail des vulnérabilités (CRITICAL, HIGH, MEDIUM, LOW)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Paquet | CVE | Sévérité | Version installée | Version corrigée | Description |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-----|----------|-------------------|------------------|-------------|" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH" or .Severity=="MEDIUM" or .Severity=="LOW") | "| \(.PkgName) | [\(.VulnerabilityID)](https://avd.aquasec.com/nvd/\(.VulnerabilityID | ascii_downcase)) | \(.Severity) | \(.InstalledVersion) | \(.FixedVersion // "N/A") | \(.Title // "") |"' trivy-results.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          else
            echo "✅ Aucune vulnérabilité détectée." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> 📦 Le rapport JSON complet est disponible dans les artefacts du workflow (rétention 90 jours)." >> "$GITHUB_STEP_SUMMARY"
          echo "> ℹ️ Les vulnérabilités sans correctif disponible sont incluses : sur une version encore supportée, ce sont celles qui restent à surveiller." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.sarif.outcome }}" = "success" ]; then
            echo "> 🔍 Le rapport SARIF est visible dans l'onglet **Security → Code scanning** du dépôt GitHub." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> ⚠️ Le rapport SARIF n'a pas pu être publié : le code scanning n'est pas activé sur ce dépôt (Settings → Code security)." >> "$GITHUB_STEP_SUMMARY"
          fi
